<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Motion Graph – Tournament Rankings</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/recap.css" />
  <link rel="stylesheet" href="css/slidemode.css" />
</head>
<body>
  <h1><span id="recap-trigger"><img src="images/favicon.svg" alt="cathedral" style="height:0.9em;vertical-align:-0.05em;" /></span> Sanca Pauper League</h1>

  <div class="view-nav">
    <!-- Row 1: Player Ranking (always visible) -->
    <div class="view-row view-row-main">
      <button class="view-btn active" id="btn-ranking">🏆 Player Ranking</button>
    </div>

    <!-- Row 2: Category toggles -->
    <div class="view-row view-row-categories">
      <button class="category-btn" id="cat-player">⚔ Player Views</button>
      <button class="category-btn" id="cat-deck">🃏 Deck Views</button>
    </div>

    <!-- Row 3: Sub-views (hidden by default) -->
    <div class="view-row view-row-sub" id="sub-player" style="display:none">
      <button class="view-btn" id="btn-podium">🥇 1st Place</button>
      <button class="view-btn" id="btn-top3finishes">🏅 Top 3 Finishes</button>
      <button class="view-btn" id="btn-winrate">📈 Win Rate</button>
      <button class="view-btn" id="btn-attendance">📅 Attendance</button>
      <button class="view-btn" id="btn-playerdrawrate">🤝 Draw Rate</button>
      <button class="view-btn" id="btn-deckdiv">🎲 Deck Diversity</button>
      <button class="view-btn new-glow" id="btn-deckdedication">💜 Deck Dedication</button>
    </div>

    <div class="view-row view-row-sub" id="sub-deck" style="display:none">
      <button class="view-btn" id="btn-deckwins">🃏 Deck Wins</button>
      <button class="view-btn" id="btn-deckpop">📊 Popularity</button>
      <button class="view-btn" id="btn-deckdrawrate">🤝 Draw Rate</button>
      <button class="view-btn" id="btn-deckwinrate">🎯 Win Rate</button>
      <button class="view-btn" id="btn-deckcount">🔢 Deck Count</button>
    </div>
  </div>

  <div id="chart-container">
    <div class="date-display" id="date-display"></div>
    <div class="tooltip" id="tooltip"></div>
    <svg id="chart"></svg>
  </div>

  <div class="controls">
    <button id="btn-play">▶ Play</button>
    <button id="btn-pause">⏸ Pause</button>
    <button id="btn-reset">↺ Reset</button>
    <span class="speed-label">Speed:</span>
    <button class="speed-btn" data-speed="2000">Slow</button>
    <button class="speed-btn active" data-speed="1000">Normal</button>
    <button class="speed-btn" data-speed="400">Fast</button>
    <span class="speed-label">│</span>
    <span class="speed-label">Month:</span>
    <select id="month-filter">
      <option value="">All</option>
    </select>
    <span class="speed-label">│</span>
    <button id="btn-slidemode">📺 Slide Mode</button>
  </div>

  <div class="legend" id="legend"></div>

  <!-- Slide mode overlay -->
  <div class="slide-overlay" id="slide-overlay">
    <div class="slide-header">
      <div class="slide-title">Sanca Pauper League</div>
      <div class="slide-label" id="slide-label"></div>
    </div>
    <div class="slide-chart-wrap" id="slide-chart-wrap"></div>
    <div class="slide-controls">
      <button class="slide-nav-btn" id="slide-prev">◀</button>
      <button class="slide-nav-btn" id="slide-pause">⏸</button>
      <button class="slide-nav-btn" id="slide-next">▶</button>
      <div class="slide-dots" id="slide-dots"></div>
      <div class="slide-speed">
        <span class="slide-speed-label">Speed:</span>
        <button class="slide-speed-btn" data-speed="2000">Slow</button>
        <button class="slide-speed-btn active" data-speed="1000">Normal</button>
        <button class="slide-speed-btn" data-speed="400">Fast</button>
      </div>
      <button class="slide-nav-btn slide-exit-btn" id="slide-exit">✕ Exit</button>
    </div>
  </div>

  <!-- Recap overlay -->
  <div class="recap-overlay" id="recap-overlay">
    <div class="recap-modal">
      <div class="recap-header">
        <select id="recap-player">
          <option value="">Choose a player…</option>
        </select>
        <button class="recap-close" id="recap-close">✕</button>
      </div>
      <div class="recap-slide-area">
        <div id="recap-slide-container">
          <div class="recap-slide recap-empty"><div class="recap-label">Select a player above</div></div>
        </div>
      </div>
      <div class="recap-footer">
        <button class="recap-nav-btn" id="recap-prev" disabled>← Prev</button>
        <div class="recap-dots" id="recap-dots"></div>
        <button class="recap-nav-btn" id="recap-next">Next →</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
